securityDefinitions:
  BearerAuth:
    description: 'Isi dengan: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Registrasi, login, refresh, logout, dan profil sendiri
  name: auth
- description: CRUD mahasiswa beserta portofolionya
  name: students
- description: Statistik lintas portofolio
  name: portfolios
- description: Daftar kelas, detail, pendaftaran, dan keluar kelas
  name: courses
- description: Ulasan kelas, balasan, ringkasan, dan penilaian bermanfaat
  name: reviews
- description: Kuota dan penugasan dosen pembimbing
  name: supervisors
- description: Perpindahan mahasiswa antar dosen pembimbing
  name: supervisions
- description: Notifikasi milik pengguna yang sedang login
  name: notifications
- description: Status antrean pekerjaan (butuh permission admin)
  name: admin
- description: Status server dan dependensi
  name: health
